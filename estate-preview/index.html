<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Alice SDLC Hub</title>
<style>
:root,:root[data-theme="light"]{color-scheme:light dark;--bg:#f7f6f3;--card:#ffffff;--border:#e6e3dc;--text:#1f1f1f;--muted:#5f5e5a;--accent:#c15f3c;--red-bg:#fae7e2;--red-tx:#9c3015;}@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#16150f;--card:#201f17;--border:#38362c;--text:#eae8e2;--muted:#b5b3ab;--accent:#d97757;--red-bg:#42201a;--red-tx:#f0a08c;}}:root[data-theme="dark"]{--bg:#16150f;--card:#201f17;--border:#38362c;--text:#eae8e2;--muted:#b5b3ab;--accent:#d97757;--red-bg:#42201a;--red-tx:#f0a08c;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
#lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
.lock-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:34px 38px;display:grid;gap:12px;width:340px}
.lock-title{font-size:20px;font-weight:800}.lock-title span{color:var(--accent)}
.lock-sub{font-size:13px;color:var(--muted)}
#lockInput{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:10px 14px;color:var(--text);font-size:14px;font-family:inherit;outline:none}
#lockInput:focus{border-color:var(--accent)}
#lockBtn{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
#lockBtn:hover{filter:brightness(1.08)}#lockBtn[disabled]{opacity:.6;cursor:default}
.lock-err{display:none;font-size:12px;color:var(--red-tx);background:var(--red-bg);border-radius:8px;padding:8px 12px;line-height:1.45;word-break:break-word}
#estate{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
body.unlocked #estate{display:block}
</style>
<script>(function(){try{var t=localStorage.getItem("alice_theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body class="locked">
<div id="lock"><div class="lock-card">
  <div class="lock-title">Alice — <span>SDLC Hub</span></div>
  <div class="lock-sub">Enter the passkey to view the dashboards. One unlock covers every dashboard on this domain.</div>
  <input type="password" id="lockInput" placeholder="Passkey" autocomplete="off" autofocus>
  <button id="lockBtn" type="button">Unlock</button>
  <div class="lock-err" id="lockErr">Wrong passkey — try again.</div>
</div></div>
<iframe id="estate" title="Alice SDLC Hub"></iframe>
<script>
(function(){
  "use strict";
  // Shared-session loader, identical model to the per-dashboard loaders it replaces:
  // the derived AES key is cached device-wide as alice_k (+ alice_kv key version) off
  // one stable shared KDF salt, so an unlock anywhere on this domain opens the estate.
  // Difference: the payload is ONE complete HTML document, mounted into a full-viewport
  // srcdoc iframe rather than injected as css/html/js. That keeps the bundle running
  // byte-identical to the file verified at the gate, with its own head and scripts intact.
  var KEY=null, META=null, booted=false;
  var SK="alice_k", SV="alice_kv";
  var input=document.getElementById("lockInput"), btn=document.getElementById("lockBtn"), err=document.getElementById("lockErr");
  function showErr(m){err.textContent=m;err.style.display="block";}
  function b64ToBuf(b64){var bin=atob(b64),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
  function bufToB64(buf){var u=new Uint8Array(buf),s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
  function loadMeta(){if(META)return Promise.resolve(META);return fetch("crypto-meta.json?v="+Date.now()).then(function(r){if(!r.ok)throw new Error("crypto-meta.json HTTP "+r.status);return r.json();}).then(function(m){META=m;return m;});}
  function deriveKey(p){return loadMeta().then(function(m){return crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]).then(function(base){return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64ToBuf(m.salt),iterations:m.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);});});}
  function importRawKey(r){return crypto.subtle.importKey("raw",b64ToBuf(r),{name:"AES-GCM"},true,["decrypt"]);}
  function clearSession(){try{localStorage.removeItem(SK);localStorage.removeItem(SV);}catch(e){}}
  function persistKey(){return crypto.subtle.exportKey("raw",KEY).then(function(raw){try{localStorage.setItem(SK,bufToB64(raw));localStorage.setItem(SV,String(META&&META.kv||1));}catch(e){}});}
  function decryptArtifact(name){return fetch(name+"?v="+Date.now()).then(function(r){if(!r.ok)throw new Error(name+" HTTP "+r.status);return r.json();}).then(function(o){return crypto.subtle.decrypt({name:"AES-GCM",iv:b64ToBuf(o.iv)},KEY,b64ToBuf(o.data));}).then(function(pt){return new TextDecoder().decode(pt);});}
  function boot(){if(booted)return Promise.resolve();booted=true;
    return decryptArtifact("estate.enc").then(function(html){
      var f=document.getElementById("estate");
      // The deep link is handed to the bundle by appending it to the srcdoc payload's
      // own hash handling: the bundle reads location.hash of its PARENT via the marker
      // below, because a srcdoc frame has no URL of its own (Dual-Context rule).
      var h=(location.hash||"").replace(/^#/,"");
      if(h){ html=html.replace("</body>","<script>window.__ESTATE_OPEN="+JSON.stringify(h)+";<\/script></body>"); }
      f.srcdoc=html;
      return new Promise(function(res){ f.addEventListener("load",function(){res();},{once:true}); });
    })
    .then(function(){document.getElementById("lock").style.display="none";document.body.classList.remove("locked");document.body.classList.add("unlocked");})
    .catch(function(e){booted=false;console.error("[estate] boot failed:",e);throw e;});}
  function attempt(){var v=input.value;if(!v)return;err.style.display="none";btn.disabled=true;
    deriveKey(v).then(function(k){KEY=k;return boot();}).then(function(){return persistKey();})
    .catch(function(e){KEY=null;btn.disabled=false;booted=false;var isAuth=e&&e.name==="OperationError";showErr(isAuth?"Wrong passkey — try again.":("Error ("+(e&&e.name||"?")+"): "+(e&&e.message||String(e))));input.value="";input.focus();});}
  function showLogin(){btn.addEventListener("click",attempt);input.addEventListener("keydown",function(e){if(e.key==="Enter")attempt();});input.focus();}
  function init(){if(!window.crypto||!window.crypto.subtle){showErr("This browser blocks Web Crypto here — open via https (not file:// or a raw IP).");return;}
    loadMeta().then(function(m){
      var kB64=null,kv=null;
      try{kB64=localStorage.getItem(SK);kv=localStorage.getItem(SV);}catch(e){}
      if(kB64&&kv===String(m.kv)){importRawKey(kB64).then(function(k){KEY=k;return boot();}).catch(function(e){console.error("[estate] session unlock failed:",e);clearSession();booted=false;showLogin();});}
      else{if(kB64)clearSession();showLogin();}
    }).catch(function(e){showErr("Error loading crypto-meta: "+(e&&e.message||String(e)));showLogin();});}
  init();
})();
</script>
</body>
</html>
